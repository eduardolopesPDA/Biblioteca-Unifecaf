name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Evita dois deploys simultâneos no GitHub Pages
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar HTML e CSS
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar HTML
        run: npm run lint:html

      - name: Validar CSS
        run: npm run lint:css

  publicar:
    name: Publicar no GitHub Pages
    needs: validar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      # Publica apenas os arquivos do site, sem configurações e dependências
      - name: Montar pasta do site
        run: |
          mkdir _site
          cp -r index.html css assets _site/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
